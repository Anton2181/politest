# Lit-Bel: Poland without the lands of the Lithuanian-Belorussian republic
# of 1919 (the Vilna, Kovno, Grodno, Minsk and Suwałki governorates), which
# form a state of their own, simulated alongside it.
#
# * Premise: the Lithuanian-Belorussian republic (Litbel, February-July 1919)
#   survives in its claimed borders: the five governorates of Vilna, Kovno,
#   Grodno, Minsk and Suwałki, without the Mogilev and Vitebsk governorates,
#   which had gone to Soviet Russia in January 1919. Poland keeps the rest of
#   its 1931 territory (with Volhynia and Galicia); there is no
#   Polish-Lithuanian union.
# * Borders: the governorates of 1897 (RISTAT GIS; data/governorates.py), not
#   the 1931 counties. Counties and okrugs that straddle a governorate border
#   are cut along it. Lit-Bel holds Lithuania without Klaipėda (Prussian
#   before 1920) and Palanga (Courland); the north-east of 1931 Poland with
#   Suwałki and Augustów (Suwałki governorate); and the Minsk-governorate part
#   of the BSSR. The Mogilev and Vitebsk parts of the BSSR are left out as
#   Soviet territory.
# * Two states in one run. Lit-Bel has its own official languages and policy;
#   migration across the Polish-Lit-Bel border is an international flow
#   (friction 0.03, against 0.10 between federal members), and Polish
#   settlement goes to Volhynia only. Each state has its own economy: its
#   own national income (from its regions' 1931 level, converging at the same
#   rate to the same target), emigration and transport budget.
# * Languages of Lit-Bel: Lithuanian, Belarusian, Polish, Yiddish and Russian
#   are all official (status, schools, open to shift). Each county works in
#   whichever of Lithuanian, Polish, Belarusian (with West Polesian) and
#   Russian had the most speakers in 1931. Assimilation pressure is low (0.6).
extends: baseline
meta:
  name: lit_bel
  description: "Poland without Lit-Bel (Vilna, Kovno, Grodno, Minsk and Suwałki governorates of 1897), a separate state with five official languages"
include_belarus: true
governorates:
  KRAI: [Vilna, Kovno, Grodno, Minsk, Suwałki]
separate_states: [LB]
members:
  _replace: true
  default: PL
  KRAI: LB
dominant_language:
  _replace: true
  default: pl
  KRAI: auto:lt,pl,be+pls,ru
official_languages:
  _replace: true
  KRAI: [lt, be, pl, yi, ru]
migration:
  member_friction:
    _replace: true
    "PL|LB": 0.03
  settlement:
    destinations:
      _replace: true
      WOL: 1.0
language:
  pressure:
    _replace: true
    default: [[1931, 1.0], [1950, 0.9], [1990, 0.8]]
    KRAI: 0.6
