# Unitary Rzeczpospolita: Lithuania incorporated without a federal language
# regime (Polish dominant everywhere) - the nineteenth-century pattern in
# which Lithuanian-speaking gentry and townspeople drifted towards Polish, and
# the Lithuanian national revival is weakened.
extends: baseline
meta:
  name: polonizing_union
  description: "Unitary union: Polish dominant in the Lithuanian lands too"
dominant_language: {_replace: true, default: pl}
language:
  status_regions:
    "LT_*": {lt: [[1931, 0.7], [1960, 0.5]], pl: 1.0, de: 0.4}
    LT_KLA: {lt: 0.5, de: 0.8}
  own_schooling_regions:
    "LT_*": {lt: [[1931, 0.6], [1960, 0.35]]}
  sigma0:
    RC:lt: 0.10
