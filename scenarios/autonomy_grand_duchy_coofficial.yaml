# Two autonomies inside a federal Poland, from 1938.
#
# 1. The Ukrainian autonomy of ukraine_autonomy_tricantonal: lwowskie,
#    tarnopolskie, stanisławowskie and Volhynia, on the 1922 statute, with
#    Ukrainian administration east of the San and Polish west of it.
#
# 2. An autonomous Grand Duchy of Lithuania with three co-official
#    languages: Lithuanian, Polish and Belarusian. It covers the Lithuanian
#    Republic and all lands east of the later Curzon line and north of
#    Volhynia (wileńskie, nowogródzkie, poleskie, and the Grodno and
#    Wołkowysk counties of białostockie). There are no cantons.
#    * All three languages are official throughout the Duchy: equal status,
#      schools in each for its speakers, and each is open to shift.
#    * Each county's working language (the contact language bilinguals learn)
#      is whichever of the three had the most speakers there in 1931
#      (West Polesian speakers count with Belarusian).
#    * Other minorities keep their own schools as in the cantonal scenario.
#      Ukrainian is taught in Polesie.
extends: ukraine_autonomy_tricantonal
meta:
  name: autonomy_grand_duchy_coofficial
  description: "Ukrainian autonomy and an autonomous Grand Duchy of Lithuania with Lithuanian, Polish and Belarusian co-official"
