# Historical Poland: the real twentieth century, for calibration.
#
# The counterfactual scenarios share their behaviour (fertility transition,
# mortality catch-up, migration, language shift, identity) with this one,
# which is held to what happened: the 1931 Polish state and the German land
# and Danzig that Poland got in 1945, simulated from 1932 as three states
# (Poland, Germany's eastern provinces, the Free City), then the war, the
# border change of 1945 and the movements of people around it, and People's
# Poland. Its output is compared with the censuses of 1946-2021
# (plsim/history_check.py; outputs/history/). Event sizes are rounded from
# the standard accounts (sources in docs/SCENARIOS.md):
#
# * War deaths. Jews: about 250,000 fled east in 1939-40 (most deported
#   into the Soviet interior, where many survived); of those who stayed,
#   about 95 % were murdered, mostly in 1942-43. Other citizens of Poland:
#   about 7 % of the population over 1939-45, with the September campaign,
#   the Soviet deportations of 1940-41, Volhynia in 1943 (about 60,000
#   Poles), the Warsaw Uprising of 1944 (150,000-200,000 civilians).
#   Germans of the eastern provinces: about a quarter of the men aged 18-45
#   killed in the war, and 5 % of all in the flight of 1945.
# * The border of 1945 (start of 1945 in the model): the German land and
#   Danzig pass to Poland, the counties mostly beyond the new eastern
#   border to the Soviet Union, which stays in the run as a separate state
#   with its own economy, a closed border and Ukrainian, Belarusian or
#   Lithuanian as contact language with Russian official.
# * Flight and expulsion of the Germans: about 60 % of the German speakers
#   gone by the end of 1945 (flight before the front, the "wild"
#   expulsions), then most of the rest by 1950; Germans of pre-war Poland
#   likewise. Autochthons (Upper Silesians, Masurians, Warmians, Kashubians)
#   mostly stay; those with German identity flee or are expelled at lower
#   rates, and leave later as Aussiedler (about 0.3 M in the 1950s, 0.1 M in
#   the 1960s, 0.2 M in the 1970s, 0.6 M in the 1980s).
# * Repatriation of Poles from the Soviet Union: 1.5 M in 1945-47 and
#   0.25 M in 1955-59, into the homes the Germans left; 0.26 M more Poles
#   (and 0.14 M Jews) back from the Soviet interior in 1946. Ukrainians to
#   the Soviet Union in 1945-46 (0.48 M), Operation Vistula in 1947
#   (0.14 M Ukrainians and Lemkos to the north and west). Settlers from
#   central Poland: about 2.5 M in 1945-50. The German land takes the vital
#   rates, schooling and mean income of the rest of Poland in 1945: it is
#   about to be resettled from there. About 0.3 M Poles stay in the
#   West (soldiers, displaced persons, forced labourers); reemigrants from
#   France and Belgium (0.2 M) come back in 1946-48.
# * Jewish survivors leave in waves: 1946-47 (after Kielce), 1949-51,
#   1956-58, 1968-69.
# * Economy: income per head follows Maddison's series (1990 GK$) for
#   Poland from 1939 to 2019 and an estimate for the Soviet west; the
#   German provinces follow Germany's path at about three quarters of its
#   level. Male excess mortality follows Poland's (a sex gap of 9 years in
#   1991). Emigration is closed 1940-45 and nearly closed in 1950-55,
#   partly open in 1956-58 and the 1970s, open in the 1980s and after 2004.
# * Language and identity: Germanisation in the German provinces before 1945
#   (pressure up to 2.0, Polish schools closed in 1939); afterwards German
#   is banned, the autochthons are pressed to be Polish, and Ukrainian
#   schools are gone until 1956.
extends: baseline
meta:
  name: historical
  description: "Historical Poland for calibration: the war, the border change of 1945, expulsions and transfers, People's Poland"
include_lithuania: false
federation: false
include_west: ["DE_*", DZ_GDA]
separate_states: [DE, DZ, SU]
snapshot_years: [1932, 1939, 1946, 1950, 1960, 1970, 1978, 1988, 2002, 2011, 2021, 2032]
members:
  _replace: true
  default: PL
  "DE_*": DE
  "DZ_*": DZ
dominant_language:
  _replace: true
  default: pl
  "DE_*": de
  "DZ_*": de
official_languages:
  _replace: true
  "DE_*": [de]
  "DZ_*": [de]
economy:
  y_path:
    DE: [[1932, 2600], [1933, 2700], [1935, 3050], [1938, 3700], [1941, 3900], [1944, 3700]]
    DZ: [[1932, 3300], [1938, 3800], [1944, 3700]]
    PL: [[1939, 2050], [1940, 1650], [1942, 1450], [1944, 1300], [1945, 1150], [1946, 1600], [1947, 1850],
         [1950, 2450], [1955, 2850], [1960, 3220], [1965, 3750], [1970, 4430], [1975, 5450], [1978, 5750],
         [1980, 5740], [1982, 5100], [1985, 5450], [1988, 5790], [1989, 5680], [1990, 5110], [1991, 4740],
         [1995, 5600], [2000, 7220], [2005, 8500], [2008, 10160], [2019, 14400]]
    SU: [[1945, 1100], [1950, 2200], [1960, 3200], [1970, 4300], [1980, 5100], [1989, 5600], [1993, 3800],
         [1998, 2900], [2008, 5000], [2019, 6500]]
  regional_programmes:
    _replace: true
    POM: [[1931, 0.006], [1939, 0.0]]
    KIE: [[1936, 0.0], [1937, 0.004], [1939, 0.0]]
    LUB: [[1936, 0.0], [1937, 0.004], [1939, 0.0]]
  equalisation: [[1931, 0.0], [1945, 0.0], [1950, 0.006], [1970, 0.004], [1990, 0.0], [2032, 0.0]]
  # forced industrialisation: towns grew faster than income alone would have pulled them
  urbanisation: {u_max: 0.64, slope: 2.0, y50: 1600.0}
fertility:
  # the war, the post-war compensation and People's Poland's pro-natalist policy (1970s-80s)
  period: [[1931, 1.0], [1933, 0.965], [1938, 0.91], [1939, 0.88], [1940, 0.80], [1944, 0.80], [1945, 0.90],
           [1946, 1.25], [1947, 1.36], [1955, 1.42], [1960, 1.30], [1965, 1.10], [1970, 1.05], [1975, 1.12],
           [1980, 1.18], [1985, 1.18], [1988, 1.12], [1990, 1.08], [1993, 0.98], [1998, 0.86], [2003, 0.78],
           [2010, 0.84], [2020, 0.86], [2032, 0.9]]
  baby_boom: {amplitude: 0.0}
mortality:
  # socialist health care: fast gains in 1946-60, stagnation from the 1970s
  catchup_post: 0.20
  gap_max: [[1931, 12.0], [1945, 12.0], [1950, 5.0], [1955, 2.5], [1965, 2.5], [1975, 5.0], [1990, 8.0], [2005, 6.5],
            [2015, 7.5], [2032, 7.0]]
  sex_gap: [[1931, 3.2], [1952, 5.6], [1960, 5.7], [1970, 7.0], [1980, 8.3], [1991, 9.2], [2000, 8.2],
            [2010, 8.5], [2019, 7.7], [2032, 7.0]]
infrastructure:
  cross_state_factor: 0.15
  enable_planned: false
migration:
  urban_kappa: 0.16
  # occupation, 1939-45: the demarcation lines and the General Government's controls stop voluntary moves
  # between regions (the wartime moves are the deportations, flights and transfers of the history below)
  internal_intensity: [[1931, 1.0], [1939, 1.0], [1940, 0.2], [1944, 0.2], [1946, 1.15], [1960, 1.3], [2000, 1.0]]
  member_friction:
    _replace: true
    "PL|DE": 0.03
    "PL|DZ": 0.05
    "DE|DZ": 0.3
    "PL|SU": 0.0
    "DE|SU": 0.0
    "DZ|SU": 0.0
  settlement:
    per_year: [[1931, 8000], [1938, 8000], [1939, 0], [2032, 0]]
  openness: [[1931, 0.12], [1939, 0.15], [1940, 0.0], [1945, 0.0], [1946, 0.3], [1949, 0.03], [1955, 0.03],
             [1956, 0.2], [1959, 0.06], [1970, 0.08], [1971, 0.15], [1980, 0.15], [1981, 0.6], [1990, 0.6],
             [1991, 0.4], [2003, 0.4], [2004, 0.9], [2008, 0.6], [2032, 0.6]]
  openness_by_state:
    SU: [[1931, 0.0], [1988, 0.0], [1992, 0.5], [2032, 0.5]]
  jewish_channel: [[1931, 0.0035], [1939, 0.0035], [1940, 0.0], [2032, 0.0]]
  german_channel: [[1931, 0.008], [1939, 0.004], [1940, 0.0], [2032, 0.0]]
language:
  pressure:
    _replace: true
    default: [[1931, 1.0], [1945, 1.6], [1956, 1.3], [1970, 1.2], [1989, 0.8]]
    "DE_*": [[1931, 1.3], [1938, 1.8], [1944, 2.0], [1945, 2.5], [1956, 1.5], [1970, 1.2], [1990, 0.8]]
    "DZ_*": [[1931, 1.2], [1938, 1.8], [1944, 2.0], [1945, 2.5], [1956, 1.5], [1970, 1.2], [1990, 0.8]]
    BIA: [[1931, 1.0], [1944, 1.0], [1945, 2.5], [1956, 2.0], [1970, 1.8], [1989, 0.8]]
  status:
    de: [[1931, 0.55], [1944, 0.55], [1945, 0.05], [1956, 0.15], [1990, 0.40]]
    # People's Poland: the minority languages stigmatised after the war (the UPA, Operation Vistula, the
    # Greek Catholic Church banned 1946-89), a little room after 1956 and again after 1989
    uk: [[1931, 0.35], [1944, 0.35], [1945, 0.08], [1956, 0.12], [1990, 0.25]]
    rue: [[1931, 0.12], [1944, 0.12], [1945, 0.04], [1990, 0.10]]
    be: [[1931, 0.15], [1944, 0.15], [1945, 0.08], [1956, 0.10], [1990, 0.15]]
    lt: [[1931, 0.35], [1944, 0.35], [1945, 0.20], [1990, 0.30]]
  status_regions:
    _replace: true
    "DE_*": {pl: [[1931, 0.15], [1944, 0.10], [1945, 1.0]]}
    "DZ_*": {pl: [[1931, 0.30], [1944, 0.10], [1945, 1.0]]}
    WIL: {lt: 0.40}
  own_schooling:
    de: [[1931, 0.50], [1944, 0.50], [1945, 0.0], [1990, 0.10]]
    uk: [[1931, 0.15], [1944, 0.15], [1945, 0.0], [1956, 0.05]]
    GC:uk: [[1931, 0.20], [1944, 0.20], [1945, 0.0], [1956, 0.05]]
    be: [[1931, 0.03], [1950, 0.15], [1990, 0.10]]
  own_schooling_regions:
    _replace: true
    "DE_*": {pl: [[1931, 0.03], [1939, 0.0], [1945, 0.0]], RC:pl: [[1931, 0.03], [1939, 0.0], [1945, 0.0]]}
history:
  # ---- German Jews emigrate, 1933-39
  - {year: 1933, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.08, label: "German Jewish emigration"}
  - {year: 1934, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.06, label: "German Jewish emigration"}
  - {year: 1935, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.06, label: "German Jewish emigration"}
  - {year: 1936, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.07, label: "German Jewish emigration"}
  - {year: 1937, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.07, label: "German Jewish emigration"}
  - {year: 1938, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.15, label: "German Jewish emigration"}
  - {year: 1939, kind: emigrate, where: ["DE_*", "DZ_*"], who: {community: [JW, JH]}, rate: 0.25, label: "German Jewish emigration"}
  # ---- 1939: the September campaign; Jews flee east
  - {year: 1939, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], sex: m, ages: [19, 45]}, number: 70000, label: "September campaign"}
  - {year: 1939, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT]}, number: 60000, label: "September campaign (civilians)"}
  - {year: 1939, kind: emigrate, where: "@member:PL", who: {community: [JW, JH]}, number: 250000, label: "Jews flee into the Soviet Union"}
  # ---- 1940-41: Soviet deportations; Germans of the Soviet zone resettled
  - {year: 1940, kind: emigrate, where: "@outside_1946", who: {identity: [pl]}, number: 200000, label: "Soviet deportations"}
  - {year: 1940, kind: emigrate, where: "@outside_1946", who: {language: [de]}, rate: 0.85, label: "Germans of Volhynia and Galicia resettled"}
  # ---- forced labour in the Reich: about 2.1 M Poles of the post-war territory, 15-45, taken in 1940-44;
  # most were back by the end of 1945, but about 0.6 M were still in the West at the census of February
  # 1946 and came back in 1946-48 (UNRRA repatriation); about 8 % stayed abroad, and some died there
  - {year: 1940, kind: away, where: "@inside_1946", within: "@member:PL", who: {identity: [pl], ages: [15, 45]}, number: 300000, back: {1945: 0.68, 1946: 0.17, 1947: 0.05, 1948: 0.02}, survive: 0.985, label: "forced labour in the Reich"}
  - {year: 1941, kind: away, where: "@inside_1946", within: "@member:PL", who: {identity: [pl], ages: [15, 45]}, number: 450000, back: {1945: 0.68, 1946: 0.17, 1947: 0.05, 1948: 0.02}, survive: 0.985, label: "forced labour in the Reich"}
  - {year: 1942, kind: away, where: "@inside_1946", within: "@member:PL", who: {identity: [pl], ages: [15, 45]}, number: 650000, back: {1945: 0.68, 1946: 0.17, 1947: 0.05, 1948: 0.02}, survive: 0.985, label: "forced labour in the Reich"}
  - {year: 1943, kind: away, where: "@inside_1946", within: "@member:PL", who: {identity: [pl], ages: [15, 45]}, number: 450000, back: {1945: 0.68, 1946: 0.17, 1947: 0.05, 1948: 0.02}, survive: 0.985, label: "forced labour in the Reich"}
  - {year: 1944, kind: away, where: "@inside_1946", within: "@member:PL", who: {identity: [pl], ages: [15, 45]}, number: 250000, back: {1945: 0.68, 1946: 0.17, 1947: 0.05, 1948: 0.02}, survive: 0.985, label: "forced labour in the Reich"}
  # ---- occupation: deaths of non-Jewish citizens of Poland, about 7 % over the war
  - {year: 1940, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT]}, rate: 0.0029, label: "occupation"}
  - {year: 1940, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], sex: m, ages: [16, 60]}, rate: 0.0062, label: "occupation (men)"}
  - {year: 1941, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT]}, rate: 0.0038, label: "occupation"}
  - {year: 1941, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], sex: m, ages: [16, 60]}, rate: 0.0083, label: "occupation (men)"}
  - {year: 1942, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT]}, rate: 0.0053, label: "occupation"}
  - {year: 1942, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], sex: m, ages: [16, 60]}, rate: 0.0114, label: "occupation (men)"}
  - {year: 1943, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT]}, rate: 0.0062, label: "occupation"}
  - {year: 1943, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], sex: m, ages: [16, 60]}, rate: 0.0135, label: "occupation (men)"}
  - {year: 1944, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT]}, rate: 0.0067, label: "occupation and front"}
  - {year: 1944, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], sex: m, ages: [16, 60]}, rate: 0.0146, label: "occupation and front (men)"}
  - {year: 1943, kind: deaths, where: WOL, who: {identity: [pl]}, rate: 0.18, label: "Volhynia massacres"}
  - {year: 1944, kind: deaths, where: [LWO, TAR, STA], who: {identity: [pl]}, rate: 0.025, label: "Eastern Galicia massacres"}
  # Poles who fled the massacres west, into the General Government (Motyka 2011: some 300,000 left Volhynia and
  # Eastern Galicia, many of them only to Lwów and the towns); they are not among the repatriates of 1944-46
  - {year: 1943, kind: transfer, from: WOL, who: {identity: [pl]}, number: 50000, to: {LUB: 0.7, WAR: 0.15, KIE: 0.15}, label: "Poles flee Volhynia"}
  - {year: 1944, kind: transfer, from: [LWO, TAR, STA], within: "@outside_1946", who: {identity: [pl]}, number: 100000, to: {KRA: 0.5, KIE: 0.3, LUB: 0.2}, label: "Poles flee Eastern Galicia"}
  - {year: 1944, kind: deaths, where: WAW, who: {community: [RC, GC, OR, PR, OT]}, rate: 0.16, label: "Warsaw Uprising"}
  - {year: 1944, kind: transfer, from: WAW, who: {community: [RC, GC, OR, PR, OT]}, rate: 0.55, to: {WAR: 0.7, KRA: 0.1, KIE: 0.1, LOD: 0.1}, label: "Warsaw emptied after the Uprising"}
  # ---- the Holocaust
  - {year: 1940, kind: deaths, where: "*", who: {community: [JW, JH]}, rate: 0.05, label: "ghettos"}
  - {year: 1941, kind: deaths, where: "*", who: {community: [JW, JH]}, rate: 0.20, label: "Holocaust"}
  - {year: 1942, kind: deaths, where: "*", who: {community: [JW, JH]}, rate: 0.72, label: "Holocaust"}
  - {year: 1943, kind: deaths, where: "*", who: {community: [JW, JH]}, rate: 0.62, label: "Holocaust"}
  - {year: 1944, kind: deaths, where: "*", who: {community: [JW, JH]}, rate: 0.45, label: "Holocaust"}
  # ---- Germans of the eastern provinces: military deaths and the flight of 1945
  - {year: 1940, kind: deaths, where: ["DE_*", "DZ_*"], who: {sex: m, ages: [18, 45], not_group: ["JW:de", "JW:yi"]}, rate: 0.01, label: "Wehrmacht losses"}
  - {year: 1941, kind: deaths, where: ["DE_*", "DZ_*"], who: {sex: m, ages: [18, 45], not_group: ["JW:de", "JW:yi"]}, rate: 0.03, label: "Wehrmacht losses"}
  - {year: 1942, kind: deaths, where: ["DE_*", "DZ_*"], who: {sex: m, ages: [18, 45], not_group: ["JW:de", "JW:yi"]}, rate: 0.04, label: "Wehrmacht losses"}
  - {year: 1943, kind: deaths, where: ["DE_*", "DZ_*"], who: {sex: m, ages: [18, 45], not_group: ["JW:de", "JW:yi"]}, rate: 0.05, label: "Wehrmacht losses"}
  - {year: 1944, kind: deaths, where: ["DE_*", "DZ_*"], who: {sex: m, ages: [18, 45], not_group: ["JW:de", "JW:yi"]}, rate: 0.09, label: "Wehrmacht losses"}
  # ---- 1945: the border change, at the start of the year
  - {year: 1945, kind: border, where: "@outside_1946", member: SU, dominant: "auto:uk,be+pls,lt", official: [ru], label: "the east to the Soviet Union"}
  - {year: 1945, kind: border, where: ["DE_*", "DZ_*"], member: PL, dominant: pl, official: [pl], like: "@member:PL", label: "German land and Danzig to Poland"}
  - {year: 1945, kind: deaths, where: ["DE_*", "DZ_*"], who: {sex: m, ages: [18, 45], not_group: ["JW:de", "JW:yi"]}, rate: 0.07, label: "Wehrmacht losses"}
  - {year: 1945, kind: deaths, where: ["DE_*", "DZ_*"], who: {language: [de]}, rate: 0.05, label: "deaths in the flight", vacate: true}
  - {year: 1945, kind: deaths, where: "@member:PL", who: {community: [RC, GC, OR, PR, OT], not_group: ["RC:de", "PR:de"]}, rate: 0.006, label: "front, 1945"}
  # flight and expulsion of the Germans
  - {year: 1945, kind: emigrate, where: "@member:PL", who: {language: [de], identity: [de, jw]}, rate: 0.70, label: "flight and wild expulsions", vacate: true}
  - {year: 1945, kind: emigrate, where: ["DE_*", "DZ_*"], who: {language: [pl, csb, cs], identity: [de]}, rate: 0.35, label: "autochthons flee", vacate: true}
  - {year: 1945, kind: emigrate, where: [DE_MAZ, DE_WAR], who: {language: [pl], identity: [de, loc]}, rate: 0.35, label: "Masurians flee", vacate: true}
  - {year: 1946, kind: emigrate, where: "@member:PL", who: {language: [de], identity: [de, jw]}, rate: 0.62, label: "expulsion", vacate: true}
  - {year: 1946, kind: emigrate, where: ["DE_*", "DZ_*"], who: {language: [pl, csb, cs], identity: [de]}, rate: 0.15, label: "expulsion of autochthons", vacate: true}
  - {year: 1947, kind: emigrate, where: "@member:PL", who: {language: [de], identity: [de, jw]}, rate: 0.55, label: "expulsion", vacate: true}
  - {year: 1948, kind: emigrate, where: "@member:PL", who: {language: [de], identity: [de, jw]}, rate: 0.40, label: "expulsion", vacate: true}
  - {year: 1949, kind: emigrate, where: "@member:PL", who: {language: [de], identity: [de, jw]}, rate: 0.25, label: "expulsion", vacate: true}
  - {year: 1950, kind: emigrate, where: "@member:PL", who: {language: [de], identity: [de, jw]}, rate: 0.25, label: "expulsion, Operation Link", vacate: true}
  # Poles: losses to the West, repatriation, settlement
  # the forced labourers who never came back are the "away" events above; here the soldiers of the Polish forces
  # in the West who stayed abroad (about 250,000 in 1945, 105,000 back by 1948, many of them from the east)
  - {year: 1945, kind: emigrate, where: "@member:PL", who: {identity: [pl], sex: m, ages: [18, 45]}, number: 120000, label: "soldiers stay in the West"}
  - {year: 1945, kind: transfer, from: "@member:SU", who: {identity: [pl]}, number: 800000, to: "@vacated", label: "repatriation from the Soviet Union"}
  - {year: 1946, kind: transfer, from: "@member:SU", who: {identity: [pl]}, number: 600000, to: "@vacated", label: "repatriation from the Soviet Union"}
  - {year: 1947, kind: transfer, from: "@member:SU", who: {identity: [pl]}, number: 100000, to: "@vacated", label: "repatriation from the Soviet Union"}
  - {year: 1946, kind: immigrate, group: "RC:pl", identity: pl, number: 260000, to: "@vacated", label: "Poles back from the Soviet interior"}
  - {year: 1946, kind: immigrate, group: "JW:yi", identity: jw, number: 140000, to: {DE_WRO: 0.3, LOD: 0.25, DE_SZC: 0.15, KRA: 0.1, WAW: 0.1, SLA: 0.1}, label: "Jews back from the Soviet Union"}
  - {year: 1946, kind: immigrate, group: "RC:pl", identity: pl, number: 100000, to: "@vacated", label: "reemigrants from the West"}
  - {year: 1947, kind: immigrate, group: "RC:pl", identity: pl, number: 70000, to: "@vacated", label: "reemigrants from the West"}
  - {year: 1948, kind: immigrate, group: "RC:pl", identity: pl, number: 30000, to: "@vacated", label: "reemigrants from the West"}
  - {year: 1945, kind: transfer, from: [WAR, KRA, KIE, LUB, LOD, POZ, POM, BIA, LWO, SLA], who: {identity: [pl]}, number: 1000000, to: "@vacated", within: "@member:PL", label: "settlers from central Poland"}
  - {year: 1946, kind: transfer, from: [WAR, KRA, KIE, LUB, LOD, POZ, POM, BIA, LWO, SLA], who: {identity: [pl]}, number: 800000, to: "@vacated", within: "@member:PL", label: "settlers from central Poland"}
